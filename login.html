<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    /* CSS Variables */
    :root {
      --background: #ffffff;
      --foreground: #0a0a0a;
      --card: #ffffff;
      --primary: #030213;
      --primary-foreground: #ffffff;
      --muted: #ececf0;
      --muted-foreground: #717182;
      --border: rgba(0, 0, 0, 0.1);
      --input-background: #f3f3f5;
      --radius: 0.625rem;
      --font-size: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: var(--font-size);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(to bottom right, #f8fafc, #f1f5f9);
      color: var(--foreground);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .hidden {
      display: none !important;
    }

    .auth-container {
      width: 100%;
      max-width: 28rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--foreground);
    }

    .btn-ghost:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-foreground);
      width: 100%;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .card {
      background-color: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }

    .card-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .card-description {
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    .card-content {
      padding: 1.5rem;
    }

    .tabs-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background-color: var(--muted);
      border-radius: var(--radius);
      padding: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .tabs-trigger {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      background-color: transparent;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tabs-trigger:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }

    .tabs-trigger.active {
      background-color: white;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--input-background);
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(3, 2, 19, 0.1);
    }

    .form-info {
      padding: 0.75rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .form-info-blue {
      background-color: #dbeafe;
      color: #1e3a8a;
    }

    .form-info-green {
      background-color: #d1fae5;
      color: #065f46;
    }

    .form-info-purple {
      background-color: #e9d5ff;
      color: #581c87;
    }

    .form-error {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-top: 1rem;
    }

    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .justify-center {
      justify-content: center;
    }

    .gap-2 {
      gap: 0.5rem;
    }

    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-6 { margin-top: 1.5rem; }

    .text-3xl {
      font-size: 1.875rem;
    }

    .text-sm {
      font-size: 0.875rem;
    }

    .text-center {
      text-align: center;
    }

    .text-slate-600 {
      color: #475569;
    }

    .text-blue-600 {
      color: #2563eb;
    }

    .icon-sm {
      width: 1rem;
      height: 1rem;
    }

    .icon-lg {
      width: 2rem;
      height: 2rem;
    }

    input[type="radio"] {
      display: none;
    }

    .link-btn {
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      color: #2563eb;
      padding: 0;
      font-size: inherit;
    }
  </style>
</head>
<body>
  
  <div class="auth-container">
    <div class="auth-header">
      <a href="guest-home.html" class="btn btn-ghost mb-4">
        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Home
      </a>
       <div class="flex items-center justify-center gap-2 mb-2">
        <img src="smartstaylogo1.png"alt="SmartStay System" style="height: 2rem;">
      </div>
      <p class="text-slate-600">Sign in to your account</p>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Login</h3>
        <p class="card-description">Choose your role and enter your credentials</p>
      </div>
      <div class="card-content">
        <div class="tabs-list">
          <label class="tabs-trigger active">
            <input type="radio" name="login-role" value="member" checked>
            Member
          </label>
          <label class="tabs-trigger">
            <input type="radio" name="login-role" value="staff">
            Staff
          </label>
          <label class="tabs-trigger">
            <input type="radio" name="login-role" value="admin">
            Admin
          </label>
        </div>

        <form id="login-form">
          <div data-role-info="member" class="form-info form-info-blue">
            Demo: member@smartstay.com / member123
          </div>
          <div data-role-info="staff" class="form-info form-info-green hidden">
            Demo: staff@smartstay.com / staff123
          </div>
          <div data-role-info="admin" class="form-info form-info-purple hidden">
            Demo: admin@smartstay.com / admin123
          </div>

          <div class="form-group">
            <label for="login-email" class="form-label">Email</label>
            <input type="email" id="login-email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
          </div>

          <div id="login-error" class="form-error hidden"></div>

          <button type="submit" class="btn btn-primary mt-4">Log In</button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-slate-600">
            Don't have an account? 
            <a href="register.html" class="text-blue-600 link-btn">Register Here</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // Demo users
    const demoUsers = {
      member: { email: 'member@smartstay.com', password: 'member123', name: 'John Member', role: 'member' },
      staff: { email: 'staff@smartstay.com', password: 'staff123', name: 'Jane Staff', role: 'staff' },
      admin: { email: 'admin@smartstay.com', password: 'admin123', name: 'Admin User', role: 'admin' }
    };

    let currentRole = 'member';

    // Role tab switching
    document.querySelectorAll('input[name="login-role"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        currentRole = e.target.value;
        
        // Update active tab
        document.querySelectorAll('.tabs-trigger').forEach(t => t.classList.remove('active'));
        e.target.closest('.tabs-trigger').classList.add('active');
        
        // Show role info
        document.querySelectorAll('[data-role-info]').forEach(info => info.classList.add('hidden'));
        document.querySelector(`[data-role-info="${currentRole}"]`).classList.remove('hidden');
      });
    });

    // Handle login
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      
      // Check demo credentials
      const user = demoUsers[currentRole];
      if (email === user.email && password === user.password) {
        // Save user to localStorage
        localStorage.setItem('smartstay_user', JSON.stringify(user));
        
        // Redirect based on role
        switch(currentRole) {
          case 'member':
            window.location.href = 'member-dashboard.html';
            break;
          case 'staff':
            window.location.href = 'staff-dashboard.html';
            break;
          case 'admin':
            window.location.href = 'admin-dashboard.html';
            break;
        }
      } else {
        errorDiv.textContent = 'Invalid email or password. Please try the demo credentials.';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
